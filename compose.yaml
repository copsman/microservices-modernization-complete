    environment:
      SERVICE_NAME: inventory
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres:5432/lab
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LEGACY_WRITES_ENABLED: ${LEGACY_WRITES_ENABLED:-false}
  payment:
