x-app: &app
  env_file: .env
  restart: unless-stopped
  depends_on:
    schema-init:
      condition: service_completed_successfully
    rabbitmq:
      condition: service_healthy
  networks: [ backend ]
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set password in .env}
      POSTGRES_DB: lab
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lab -d lab" ]
      interval: 3s
      retries: 30
    networks: [ backend ]
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports: [ "127.0.0.1:15672:15672" ]
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      retries: 20
    networks: [ backend ]
  schema-init:
    build:
      context: .
      args: { SERVICE_DIR: common }
    command: [ "python", "-m", "common.schema" ]
    environment:
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres:5432/lab
    depends_on:
      postgres: { condition: service_healthy }
    networks: [ backend ]
  gateway:
    <<: *app
    build:
      context: .
      args: { SERVICE_DIR: api-gateway }
    environment:
      SERVICE_NAME: gateway
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres:5432/lab
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      PAYMENT_MODE: ${PAYMENT_MODE:-stripe}
      EMAIL_MODE: ${EMAIL_MODE:-smtp}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LEGACY_WRITES_ENABLED: ${LEGACY_WRITES_ENABLED:-false}
    ports: [ "127.0.0.1:8000:8000" ]
  order:
    <<: *app
    build:
      context: .
      args: { SERVICE_DIR: order-service }
    environment:
      SERVICE_NAME: order
      DATABASE_URL: postgresql+psycopg://lab:${POSTGRES_PASSWORD}@postgres:5432/lab
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/%2F
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LEGACY_WRITES_ENABLED: ${LEGACY_WRITES_ENABLED:-false}
  inventory:
